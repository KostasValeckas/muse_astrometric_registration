[metadata]
name = muse_astrometric_registration
author = Kostas Valeckas
version = 0.1.0
author_email = kostas.valeckas@nbi.ku.dk
description = A Python pipeline for the astrometric registration of astronomical images, currently configured for MUSE frames.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://muse-astrometric-registration.readthedocs.io
license = MIT
license_files =
    LICENSE
    muse_astrometric_registration/_vendor/spacepylot/LICENSE.txt
project_urls =
    Documentation = https://muse-astrometric-registration.readthedocs.io
    Source = https://github.com/KostasValeckas/muse_astrometric_registration/
    Tracker = https://github.com/KostasValeckas/muse_astrometric_registration/issues/
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Astronomy
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3

[options]
python_requires = >=3.12
# spacepylot (not on PyPI) is bundled in muse_astrometric_registration/_vendor;
# scipy < 1.19: spacepylot's regress_odr (not used by the pipeline) imports
# scipy.odr, which SciPy 1.19 removes
install_requires =
    astroalign >= 2.6.2
    astropy >= 8.0.1
    colorama >= 0.4.6
    colorcet >= 3.2.1
    matplotlib >= 3.11.2
    numpy >= 2.5.3
    reproject >= 0.21.0
    scikit-image >= 0.26.0
    scipy >= 1.18.1, < 1.19
    sep >= 1.4.1

packages = find:
include_package_data = True

[options.packages.find]
include =
    muse_astrometric_registration
    muse_astrometric_registration.*

[options.package_data]
muse_astrometric_registration._vendor.spacepylot = LICENSE.txt

[options.extras_require]
doc =
    sphinx >= 7.0
    sphinx_rtd_theme >= 2.0

test =
    pytest

all =
    %(doc)s
    %(test)s

[options.entry_points]
console_scripts =
    muse_astrometric_registration_hybrid = muse_astrometric_registration.hybrid_pipeline:main
    muse_astrometric_registration_single = muse_astrometric_registration.run:main
    muse_astrometric_registration_manual = muse_astrometric_registration.manual_alignment:main
